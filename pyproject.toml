[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rts-local-controller"
version = "0.1.0"
description = "Local, observable RTS control loop with verified actions"
requires-python = ">=3.11"

[project.scripts]
rts-controller = "rts_controller.cli:main"

[tool.setuptools.packages.find]
include = ["rts_controller*"]
